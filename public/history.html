<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search History - WeatherNow</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #f5f8fa;
      padding: 2rem;
    }
    h2 {
      color: #0288d1;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5rem;
    }
    th, td {
      padding: 0.8rem;
      border: 1px solid #ccc;
      text-align: left;
    }
    th {
      background-color: #e1f5fe;
    }
  </style>
</head>
<body>
  <h2>Search History</h2>
  <table id="historyTable">
    <thead>
      <tr>
        <th>City</th>
        <th>Search Time</th>
      </tr>
    </thead>
    <tbody>
      <!-- Search history will be injected here -->
    </tbody>
  </table>

  <script>
    fetch('/api/history')
      .then(res => res.json())
      .then(data => {
        const tbody = document.querySelector("#historyTable tbody");

        if (!Array.isArray(data) || data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="2">No search history found.</td></tr>`;
          return;
        }

        data.forEach(entry => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${entry.city}</td>
            <td>${new Date(entry.date).toLocaleString()}</td>
          `;
          tbody.appendChild(row);
        });
      })
      .catch(err => {
        document.body.innerHTML += "<p style='color:red;'>Failed to load history data.</p>";
        console.error(err);
      });
  </script>
</body>
</html>
